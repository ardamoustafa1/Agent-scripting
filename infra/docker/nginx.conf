# Static hosting for Verbis web apps. Security headers per docs/SECURITY.md §5.2.
limit_req_zone $binary_remote_addr zone=telemetry:10m rate=5r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/snippets/frame-sources.conf;
  # nginx request_id: 16 random bytes, unique for each response; never cache nonce HTML.
  sub_filter_once off;
  sub_filter '__VERBIS_CSP_NONCE__' '$request_id';

  location = /telemetry/v1/traces {
    include /etc/nginx/snippets/security-headers.conf;
    limit_except POST { deny all; }
    limit_req zone=telemetry burst=10 nodelay;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=30s;
    set $telemetry_collector http://otel-collector:4318;
    proxy_pass $telemetry_collector/v1/traces;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
  }

  location = /api/v1/security/csp-reports {
    include /etc/nginx/snippets/security-headers.conf;
    limit_except POST { deny all; }
    limit_req zone=telemetry burst=10 nodelay;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=30s;
    set $security_report_upstream http://api:4000/v1/security/csp-reports;
    proxy_pass $security_report_upstream;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header ssl-client-cert "";
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 1s;
    proxy_read_timeout 6s;
  }

  location = /health {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # The BFF/api-gateway (roadmap step 7) will own /api. Until then, never fall back to the SPA.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/problem+json;
    return 404 '{"type":"https://errors.verbis.io/not-found","title":"Not Found","status":404,"code":"VERBIS_HTTP_NOT_FOUND"}';
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
