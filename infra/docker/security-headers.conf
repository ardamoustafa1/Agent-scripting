# Included in every location: nginx drops server-level add_header when a location adds its own.
add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-$request_id' 'strict-dynamic'; script-src-attr 'none'; style-src 'self' 'nonce-$request_id'; style-src-attr 'none'; require-trusted-types-for 'script'; trusted-types dompurify verbis-plugin; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src $verbis_frame_sources; frame-ancestors 'self'; report-uri /api/v1/security/csp-reports" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
