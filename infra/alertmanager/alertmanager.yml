global:
  resolve_timeout: 5m
route:
  receiver: local-ops
  group_by: [alertname, service_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  # Local Alertmanager UI records alerts. Production injects approved webhook/email receivers.
  - name: local-ops
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, service_name]
