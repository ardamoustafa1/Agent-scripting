server:
  port: '${SIDECAR_PORT:8085}'
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
spring:
  main.banner-mode: off
verbis:
  sidecar:
    connector-id: '${VERBIS_CONNECTOR_ID}'
    # psdk (required). replay (recorded events) is dev/test only and needs SIDECAR_ALLOW_REPLAY=true.
    source: '${SIDECAR_SOURCE:}'
    allow-replay: '${SIDECAR_ALLOW_REPLAY:false}'
    agent-identity: '${SIDECAR_AGENT_IDENTITY:employeeId}'
    nats:
      servers: '${NATS_SERVERS:nats://127.0.0.1:4222}'
      creds-file: '${NATS_CREDS_FILE:}'
      stream: '${NATS_STREAM:VERBIS_ENGAGE}'
      create-stream: '${NATS_CREATE_STREAM:false}'
    replay:
      file: '${SIDECAR_REPLAY_FILE:}'
    psdk:
      application-name: '${PSDK_APP_NAME:Verbis_Sidecar}'
      tserver:
        {
          name: '${TSERVER_NAME:TServer}',
          host: '${TSERVER_HOST:}',
          port: '${TSERVER_PORT:0}',
          backup-host: '${TSERVER_BACKUP_HOST:}',
          backup-port: '${TSERVER_BACKUP_PORT:0}',
        }
      ixn-server:
        { name: '${IXN_NAME:InteractionServer}', host: '${IXN_HOST:}', port: '${IXN_PORT:0}' }
      config-server:
        {
          host: '${CONFSERV_HOST:}',
          port: '${CONFSERV_PORT:0}',
          user: '${CONFSERV_USER:}',
          password-file: '${CONFSERV_PASSWORD_FILE:}',
        }
      dns: '${TSERVER_DNS:}'
      user-data-allow-list: '${USER_DATA_ALLOW_LIST:}'

otel:
  service.name: verbis-engage-sidecar
  exporter.otlp.protocol: http/protobuf
  exporter.otlp.endpoint: '${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}'
  logs.exporter: none
