server:
  port: ${SIDECAR_PORT:8086}
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
spring:
  main.banner-mode: off
verbis:
  sidecar:
    connector-id: ${VERBIS_CONNECTOR_ID}
    # aes | aacc (required; one platform per connector; outbound is an add-on to aes/aacc).
    # replay (recorded events) is dev/test only and additionally needs SIDECAR_ALLOW_REPLAY=true.
    source: ${SIDECAR_SOURCE:}
    allow-replay: ${SIDECAR_ALLOW_REPLAY:false}
    nats:
      servers: ${NATS_SERVERS:nats://127.0.0.1:4222}
      creds-file: ${NATS_CREDS_FILE:}
      stream: ${NATS_STREAM:VERBIS_AVAYA}
      create-stream: ${NATS_CREATE_STREAM:false}
    replay:
      file: ${SIDECAR_REPLAY_FILE:}
    aes:
      # TSAPI tlink, e.g. AVAYA#CM01#CSTA#AES01 (secure link: CSTA-S)
      tlink: ${AES_TLINK:}
      servers: ${AES_SERVERS:}
      user: ${AES_USER:}
      password-file: ${AES_PASSWORD_FILE:}
      # Agent stations to observe (or VDNs: observing a VDN gives delivered events before agents)
      extensions: ${AES_EXTENSIONS:}
      vdns: ${AES_VDNS:}
      uui-encoding: ${AES_UUI_ENCODING:auto}
    aacc:
      ccmm-url: ${AACC_CCMM_URL:}
      ccmm-user: ${AACC_CCMM_USER:}
      ccmm-password-file: ${AACC_CCMM_PASSWORD_FILE:}
      # HMAC secret (>= 32 bytes, mounted file) signing the CCT callback token; required in aacc mode.
      notify-secret-file: ${AACC_NOTIFY_SECRET_FILE:}
      # CCT WS-BaseNotification endpoint (https) and this sidecar's public https base URL; the
      # sidecar subscribes/renews/unsubscribes itself (unverified against a real CCT).
      cct-url: ${AACC_CCT_URL:}
      cct-user: ${AACC_CCT_USER:}
      cct-password-file: ${AACC_CCT_PASSWORD_FILE:}
      callback-base-url: ${AACC_CALLBACK_BASE_URL:}
      subscription-ttl-seconds: ${AACC_SUBSCRIPTION_TTL_SECONDS:3600}
      intrinsics-allow-list: ${AACC_INTRINSICS_ALLOW:}
    outbound:
      system: ${OUTBOUND_SYSTEM:none} # pom | pc | none
      pc-host: ${PC_HOST:}
      pc-port: ${PC_PORT:22700}
      pc-user: ${PC_USER:}
      pc-password-file: ${PC_PASSWORD_FILE:}
      pom-url: ${POM_URL:}

otel:
  service.name: verbis-avaya-sidecar
  exporter.otlp.protocol: http/protobuf
  exporter.otlp.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}
  logs.exporter: none
