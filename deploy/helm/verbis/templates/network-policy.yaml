{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-isolation }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports: [{ port: 8080, protocol: TCP }, { port: 4000, protocol: TCP }]
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.monitoringNamespaceLabels | nindent 14 }}
      ports: [{ port: 4000, protocol: TCP }, { port: 4100, protocol: TCP }, { port: 4200, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
    - to:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.dependencyNamespaceLabels | nindent 14 }}
      ports: [{ port: 5432, protocol: TCP }, { port: 6379, protocol: TCP }, { port: 4222, protocol: TCP }, { port: 9000, protocol: TCP }]
    {{- with .Values.networkPolicy.externalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
