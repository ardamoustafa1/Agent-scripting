{{- if .Values.ingress.enabled }}
{{- range $svc, $host := .Values.ingress.hosts }}
{{- if not (index $.Values.services $svc).enabled }}{{ fail "ingress references a disabled web service" }}{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ $svc }}
  annotations: {{ toYaml $.Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - secretName: {{ required "TLS secret is required" $.Values.ingress.tlsSecret }}
      hosts: [{{ $host | quote }}]
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $.Release.Name }}-{{ $svc }}, port: { number: 8080 } }
{{- end }}
{{- end }}
