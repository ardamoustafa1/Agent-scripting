name: verbis
services:
  api:
    image: ${API_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - verbis
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 90s
    env_file:
      - ${VERBIS_SECRET_DIR:?private secret directory required}/api.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      COLLABORATION_PORT: '0'
      COLLABORATION_INTERNAL_URL: http://collaboration:4010
      CONNECTOR_HUB_URL: http://connector-hub:4100
      NATS_STREAM_REPLICAS: '1'
  audit-worker:
    image: ${API_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - verbis
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 90s
    env_file:
      - ${VERBIS_SECRET_DIR:?private secret directory required}/audit-worker.env
    environment:
      NODE_ENV: production
    command:
      - dist/audit-worker.js
  connector-hub:
    image: ${CONNECTOR_HUB_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - verbis
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 90s
    env_file:
      - ${VERBIS_SECRET_DIR:?private secret directory required}/connector-hub.env
    environment:
      NODE_ENV: production
      CONNECTOR_HUB_HOST: 0.0.0.0
    volumes:
      - ${VERBIS_SECRET_DIR}/hub-mtls:/var/run/verbis:ro
  collaboration:
    image: ${API_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - verbis
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 90s
    env_file:
      - ${VERBIS_SECRET_DIR:?private secret directory required}/api.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      COLLABORATION_PORT: '4010'
      COLLABORATION_ADDRESS: 0.0.0.0
      OUTBOX_RELAY_ENABLED: 'false'
      EVENT_CONSUMERS_ENABLED: 'false'
  admin-web:
    image: ${ADMIN_WEB_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/cache/nginx:rw,nosuid,size=64m
      - /var/run:rw,nosuid,size=16m
    networks:
      - verbis
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 90s
    ports:
      - 127.0.0.1:8081:8080
    volumes:
      - ./nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - collaboration
  designer-web:
    image: ${DESIGNER_WEB_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/cache/nginx:rw,nosuid,size=64m
      - /var/run:rw,nosuid,size=16m
    networks:
      - verbis
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 90s
    ports:
      - 127.0.0.1:8082:8080
    volumes:
      - ./nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - collaboration
  agent-web:
    image: ${AGENT_WEB_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/cache/nginx:rw,nosuid,size=64m
      - /var/run:rw,nosuid,size=16m
    networks:
      - verbis
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 90s
    ports:
      - 127.0.0.1:8083:8080
    volumes:
      - ./nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - collaboration
  migration:
    image: ${MIGRATION_IMAGE:?digest-pinned image required}
    profiles:
      - migration
    env_file:
      - ${VERBIS_SECRET_DIR}/migration.env
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - verbis
networks:
  verbis:
    driver: bridge
