externalSecrets:
  enabled: true
  storeRef: { name: verbis-secrets, kind: ClusterSecretStore }
  items:
    - name: verbis-api-env
      data:
        - secretKey: MTLS_PROXY_SECRET
          remoteRef: { key: verbis/api, property: MTLS_PROXY_SECRET }
        - secretKey: DATABASE_APP_URL
          remoteRef: { key: verbis/api, property: DATABASE_APP_URL }
        - secretKey: REDIS_URL
          remoteRef: { key: verbis/api, property: REDIS_URL }
        - secretKey: NATS_URL
          remoteRef: { key: verbis/api, property: NATS_URL }
    - name: verbis-connector-hub-env
      data:
        # Durable dead-letter queue (JetStream); the hub refuses to start in production without it.
        - secretKey: HUB_DLQ_NATS_URL
          remoteRef: { key: verbis/connector-hub, property: HUB_DLQ_NATS_URL }
# Extend this mapping to ALL required env keys from .env.example/ApiEnvSchema.
# Migration owner, audit worker and hub credentials MUST use separate remote keys/Secret objects.
