name: Signed release images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verification:
    uses: ./.github/workflows/verification.yml
    permissions:
      contents: read
  live:
    uses: ./.github/workflows/live-acceptance.yml
    secrets: inherit
    permissions:
      contents: read
  publish:
    needs: [verification, live]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: api,
              app: api,
              file: infra/docker/node-app.Dockerfile,
              context: '.',
              target: runtime,
            }
          - {
              name: connector-hub,
              app: connector-hub,
              file: infra/docker/node-app.Dockerfile,
              context: '.',
              target: runtime,
            }
          - {
              name: migration,
              app: api,
              file: infra/docker/node-app.Dockerfile,
              context: '.',
              target: migration,
            }
          - {
              name: admin-web,
              app: admin-web,
              file: infra/docker/web-app.Dockerfile,
              context: '.',
              target: runtime,
            }
          - {
              name: designer-web,
              app: designer-web,
              file: infra/docker/web-app.Dockerfile,
              context: '.',
              target: runtime,
            }
          - {
              name: agent-web,
              app: agent-web,
              file: infra/docker/web-app.Dockerfile,
              context: '.',
              target: runtime,
            }
          - {
              name: engage-sidecar,
              app: '',
              file: Dockerfile,
              context: apps/connector-genesys-engage-sidecar,
              target: '',
            }
          - {
              name: avaya-sidecar,
              app: '',
              file: Dockerfile,
              context: apps/connector-avaya-aes-sidecar,
              target: '',
            }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image repository
        id: repo
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: echo "image=ghcr.io/${OWNER,,}/verbis-$NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context == '.' && matrix.file || format('{0}/{1}', matrix.context, matrix.file) }}
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.repo.outputs.image }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Sign and verify immutable digest with GitHub OIDC
        env:
          IMAGE: ${{ steps.repo.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@${{ github.ref }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.name }}
          path: image-${{ matrix.name }}.txt
          if-no-files-found: error
