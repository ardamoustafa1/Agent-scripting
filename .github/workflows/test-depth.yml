name: Mutation and stability
on:
  pull_request:
    paths:
      - 'packages/expr/**'
      - 'packages/script-schema/**'
      - 'tests/playwright/**'
      - 'scripts/*policy*'
      - '**/e2e/**'
      - '**/playwright.config.ts'
      - '.github/workflows/test-depth.yml'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-depth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    runs-on: ubuntu-latest
    # script-schema has ~3.4k mutants; static (module-level schema) mutants rerun the whole suite.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [expr, script-schema]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @verbis/${{ matrix.package }} test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/mutation/
          if-no-files-found: error
  stability:
    name: stability (${{ matrix.lane }} ${{ matrix.app }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANE_APP: ${{ matrix.app }}
      LANE_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # The 5x repeat lane over the whole designer suite alone exceeds any single-job budget,
        # so it is sharded; quarantine runs once over everything.
        include:
          - { lane: flaky, app: designer-web, shard: 1/4 }
          - { lane: flaky, app: designer-web, shard: 2/4 }
          - { lane: flaky, app: designer-web, shard: 3/4 }
          - { lane: flaky, app: designer-web, shard: 4/4 }
          - { lane: flaky, app: agent-web, shard: 1/1 }
          - { lane: flaky, app: admin-web, shard: 1/1 }
          - { lane: quarantine, app: '', shard: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @verbis/agent-web exec playwright install --with-deps chromium
      - run: pnpm test:${{ matrix.lane }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stability-${{ matrix.lane }}-${{ matrix.app }}-${{ strategy.job-index }}
          path: |
            apps/*/test-results/
            apps/*/playwright-report/
