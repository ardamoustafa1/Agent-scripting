name: Deployment policy
on:
  pull_request:
    paths:
      [
        'deploy/**',
        'infra/docker/**',
        'apps/connector-*/Dockerfile',
        '.github/workflows/deployment-policy.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.1
        with: { version: v3.19.0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install PyYAML==6.0.2
      - name: Chart policy acceptance
        run: python -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Shell syntax
        run: bash -n deploy/scripts/export-airgap.sh deploy/scripts/import-airgap.sh deploy/scripts/restore-drill.sh
      - name: Helm lint
        run: helm lint deploy/helm/verbis -f deploy/examples/values-render.json --strict
