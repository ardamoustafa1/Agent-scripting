kind: Deployment
metadata:
  name: verbis-admin-web
  labels:
    app.kubernetes.io/part-of: verbis
    app.kubernetes.io/instance: verbis
    app.kubernetes.io/name: admin-web
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
