  selector:
    matchLabels: { app.kubernetes.io/instance: verbis, app.kubernetes.io/name: admin-web }
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verbis
        app.kubernetes.io/instance: verbis
        app.kubernetes.io/name: admin-web
        verbis.io/region: "local"
        verbis.io/cell: "default"
      annotations:
        checksum/web-config: 5d9c5fc63b989f062f8584afb5ba1b6e8244c21b07d69e5918b8f77cd78a2a36
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext: { runAsNonRoot: true, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: verbis, app.kubernetes.io/name: admin-web }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: verbis, app.kubernetes.io/name: admin-web }
      containers:
        - name: admin-web
          image: "ghcr.io/your-org/verbis-admin-web:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: NODE_ENV, value: production }
          resources: 
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: http }
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            timeoutSeconds: 3
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: web-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - { name: nginx-cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: nginx-run, emptyDir: { sizeLimit: 16Mi } }
        - name: web-config
          configMap: { name: verbis-web-config }

