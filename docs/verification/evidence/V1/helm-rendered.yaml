# Source: verbis/templates/network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: verbis-isolation }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: verbis }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: verbis }
    - from:
        - namespaceSelector:
            matchLabels: 
              kubernetes.io/metadata.name: ingress-nginx
      ports: [{ port: 8080, protocol: TCP }, { port: 4000, protocol: TCP }]
    - from:
        - namespaceSelector:
            matchLabels: 
              kubernetes.io/metadata.name: monitoring
      ports: [{ port: 4000, protocol: TCP }, { port: 4100, protocol: TCP }, { port: 4200, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: verbis }
    - to:
        - namespaceSelector:
            matchLabels: 
              kubernetes.io/metadata.name: verbis-data
      ports: [{ port: 5432, protocol: TCP }, { port: 6379, protocol: TCP }, { port: 4222, protocol: TCP }, { port: 9000, protocol: TCP }]

