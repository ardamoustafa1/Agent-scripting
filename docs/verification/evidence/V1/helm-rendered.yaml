# Source: verbis/templates/web-config.yaml
apiVersion: v1
kind: ConfigMap
metadata: { name: verbis-web-config }
data:
  default.conf: |
    # Static hosting for Verbis web apps. Security headers per docs/SECURITY.md §5.2.
    limit_req_zone $binary_remote_addr zone=telemetry:10m rate=5r/s;
    
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      server_tokens off;
      include /etc/nginx/snippets/frame-sources.conf;
      # nginx request_id: 16 random bytes, unique for each response; never cache nonce HTML.
      sub_filter_once off;
      sub_filter '__VERBIS_CSP_NONCE__' '$request_id';
    
      location = /telemetry/v1/traces {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
      }
    
      location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 200 '{"status":"ok"}';
      }
    
      location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://verbis-api:4000/;
        proxy_set_header ssl-client-cert "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
      }
      location /socket.io/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://verbis-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header ssl-client-cert "";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_buffering off;
      }
      location /collaboration {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://verbis-collaboration:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header ssl-client-cert "";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_buffering off;
      }
    
      location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
      }
    
      location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
      }
    }
    

